<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="cart.css">
    <link rel="shortcut icon"
        href="https://i.postimg.cc/T2Lx6cQG/STYLE-UP-Photo-Room.png"
        type="image/x-icon">
</head>
<body>

    <div id="navbar">
        <div id="left">
            <div>
                <a href="index.html">
                    <img src="https://i.postimg.cc/T2Lx6cQG/STYLE-UP-Photo-Room.png">
                </a>
            </div>
        </div>

        <div id="centre">
            <span>
                <span>BAG</span> ------------- 
                <a href="Address.html">ADDRESS</a> ------------- 
                <a href="payment.html">PAYMENT</a>
            </span>
        </div>

        <div id="right">
            <div>
                <img src="https://i.postimg.cc/NGSHspcx/sprite-secure.png">
            </div>
            <div id="secure">
                <span>100% Secure</span>
            </div>
        </div>
    </div>

    <div id="cartdiv">

        <span id="product"></span>

        <div id="totalcart">
            <div>
                <h2>PRICE DETAILS</h2>
                <br>

                <span>Items :</span>
                <span id="Noofitems"></span>
                <br>
                <hr>

                <span>Total MRP : ₹</span>
                <span id="cart-value"></span>
                <br>
                <hr>

                <form>
                    <label>Enter Coupon Code</label>
                    <br>

                    <input
                        type="text"
                        placeholder="Enter Coupon Code"
                        id="coupan">

                    <input
                        type="submit"
                        value="Apply Coupon">
                </form>

                <hr>

                <span>Total Amount : ₹</span>
                <span id="Finalamount"></span>

                <br><br>

                <button id="address">
                    <a href="Address.html">PLACE ORDER</a>
                </button>
            </div>
        </div>

    </div>

</body>
</html>

<script>

let cartarr = JSON.parse(localStorage.getItem("cartData")) || [];

window.addEventListener("load", function () {
    displaycart(cartarr);
    update();
});

// Display Cart Items
function displaycart(cartarr) {

    document.querySelector("#product").innerHTML = "";

    cartarr.forEach(function (el, index) {

        let dives = document.createElement("div");
        dives.style.padding = "5px";
        dives.style.backgroundColor = "#fdefea";
        dives.style.marginBottom = "10px";

        let divs = document.createElement("div");

        let image = document.createElement("img");
        image.setAttribute("src", el.image_url);

        let name = document.createElement("h3");
        name.innerText = el.name;

        let price = document.createElement("p");
        price.innerText = "₹" + el.cartprice;

        let quan = document.createElement("div");
        quan.style.marginLeft = "10px";
        quan.style.justifyContent = "space-between";
        quan.style.textAlign = "left";

        let dile = document.createElement("span");
        dile.style.border = "1px solid #ccc";
        dile.style.margin = "0px";

        // Decrease Button
        let decr = document.createElement("button");
        decr.innerText = "-";

        decr.addEventListener("click", function () {
            decrease(el, index, cartarr);
        });

        // Quantity
        let quantity = document.createElement("span");
        quantity.innerText = " " + el.quantity + " ";

        // Increase Button
        let incr = document.createElement("button");
        incr.innerText = "+";

        incr.addEventListener("click", function () {
            increase(el, index, cartarr);
        });

        dile.append(decr, quantity, incr);

        // Remove Button
        let dele = document.createElement("button");
        dele.innerText = "REMOVE";

        dele.addEventListener("click", function () {
            removeitem(index, cartarr);
        });

        quan.append(name, price, dile, dele);
        divs.append(image, quan);
        dives.append(divs);

        document.querySelector("#product").append(dives);
    });
}

// Decrease Quantity
function decrease(el, i, arr) {

    if (arr[i].quantity > 1) {

        arr[i].quantity--;
        arr[i].cartprice = arr[i].quantity * el.price;

        localStorage.setItem(
            "cartData",
            JSON.stringify(arr)
        );

        window.location.reload();
    }
}

// Increase Quantity
function increase(el, i, arr) {

    arr[i].quantity++;

    arr[i].cartprice = arr[i].quantity * el.price;

    localStorage.setItem(
        "cartData",
        JSON.stringify(arr)
    );

    window.location.reload();
}

// Remove Item
function removeitem(i, arr) {

    let confirmDelete =
        confirm("Are you sure you want to remove this item?");

    if (confirmDelete) {

        arr.splice(i, 1);

        localStorage.setItem(
            "cartData",
            JSON.stringify(arr)
        );

        window.location.reload();
    }
}

// Update Cart Summary
function update() {

    let items = 0;
    let cartvalue = 0;

    let cartarr1 =
        JSON.parse(localStorage.getItem("cartData")) || [];

    for (let i = 0; i < cartarr1.length; i++) {

        items += cartarr1[i].quantity;
        cartvalue += cartarr1[i].cartprice;
    }

    document.querySelector("#Noofitems").innerText = items;
    document.querySelector("#cart-value").innerText = cartvalue;
    document.querySelector("#Finalamount").innerText = cartvalue;
}

// Coupon Section
document.querySelector("form")
    .addEventListener("submit", handlepayment);

let formtag = document.querySelector("form");

function handlepayment(event) {

    event.preventDefault();

    let coupon =
        document.querySelector("#coupan").value.trim();

    let cartvalue =
        Number(document.querySelector("#Finalamount").innerText);

    if (coupon === "masai30") {

        let discountedAmount =
            (cartvalue * 0.70).toFixed(2);

        document.querySelector("#Finalamount")
            .innerText = discountedAmount;

        alert("Coupon Applied Successfully! 30% Discount Added.");

    } else {

        alert("Invalid Coupon Code.");
    }
}

</script>
